name: Server Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/server-deploy.yml'

permissions:
  contents: read

concurrency:
  group: server-production-deploy
  cancel-in-progress: false

jobs:
  deploy-server:
    name: Deploy backend server
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: ./server
        run: npm ci

      - name: Build backend
        working-directory: ./server
        run: npm run build

      - name: Run database migrations
        working-directory: ./server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -e
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is required."
            exit 1
          fi
          npm run migration:run

      - name: Restart backend service
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing SSH deployment secrets."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/id_ed25519 "$SERVER_USER@$SERVER_HOST" "cd /path/to/your/project/server && git pull origin main && npm ci && npm run build && pm2 restart flashkart-server || pm2 start npm --name flashkart-server -- run start"

      - name: Verify backend health
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -e
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret is required."
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if curl --fail --silent "$BACKEND_URL/health" > /tmp/backend-health.json; then
              echo "Backend is healthy."
              cat /tmp/backend-health.json
              exit 0
            fi
            echo "Health check failed, retrying in 10 seconds..."
            sleep 10
          done

          echo "Backend health check failed after retries."
          exit 1
