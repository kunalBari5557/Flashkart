version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: flashkart-postgres
    environment:
      POSTGRES_DB: flashkart
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flashkart

  redis:
    image: redis:7-alpine
    container_name: flashkart-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flashkart

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flashkart-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:123456@postgres:5432/flashkart
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-secret-key-here
      RESERVATION_TTL_SECONDS: 300
      MAX_CONCURRENT_RESERVATIONS_PER_USER: 5
      RATE_LIMIT_REQUESTS_PER_MINUTE: 100
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - flashkart
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  flashkart:
    driver: bridge
